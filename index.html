<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .invitation {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .details {
            margin: 20px 0;
            line-height: 1.6;
        }
        .date {
            font-size: 1.2em;
            color: #e74c3c;
            margin: 20px 0;
        }
        .location {
            font-style: italic;
            margin: 20px 0;
        }
        .rsvp {
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .para{
            background-color: #dfc8c8;
            padding: 20px;
        }
        .accept-btn {
            background-color: #2ecc71;
            color: white;
            padding: 4px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        .reject-btn {
            background-color: #e74c3c;
            color: white;
            padding: 40px 80px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            transition: all 0.1s ease;
        }
        .buttons-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .emojis {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            font-size: 80px;
        }
        .tv-shows {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .tv-shows img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="invitation">
        <h1>Convite para jantar Julia GOURDARD 'GOUDÁR'</h1>
     
        <div class="tv-shows">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiMugU1hc1B4PS2_mnyZWSRXASaEnyGkHsRH0T4ylnH_AlUTJFOfwuDeyDQTebomrZzZa7bKPEvug_dwsqlqvYcauTlUeKWSfnpFh30fdTeOD7sSFouTnlDHXcOAuqwcHrhGc4LfMYw-0Al/s400/GeraldoBras2.jpg" alt="Nerd">
            <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=400&q=80" alt="Cinema">
        </div>
        <div class="details">
    
            <div class="date">
                <p>data 2025-09-07(YYYY-MM-DD)</p>
            </div>
            <div class="location">
                <p>Local: Azu ou coxinha com refri no posto da lagoa</p>
            </div>
            <p>By Raphael Portela de Araujo Jansen Ferreira</p>
            <button class="accept-btn" onclick="alert('SÁBIA ESCOLHA POR UMA PESSOA SÁBIA')">Aceitar</button>
            <div class="buttons-container">
                <button class="reject-btn" id="rejectBtn">Recusar</button>
            </div>
        </div>
    </div>
    <script>
        const rejectBtn = document.getElementById('rejectBtn');
        
        function moveButton() {
            const container = document.querySelector('.invitation');
            const containerRect = container.getBoundingClientRect();
            const buttonRect = rejectBtn.getBoundingClientRect();
            
            const maxX = containerRect.width - buttonRect.width;
            const maxY = containerRect.height - buttonRect.height;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            rejectBtn.style.position = 'absolute';
            rejectBtn.style.left = randomX + 'px';
            rejectBtn.style.top = randomY + 'px';
        }
        
        rejectBtn.addEventListener('mouseover', moveButton);
        rejectBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });
    </script>
</body>
</html>
